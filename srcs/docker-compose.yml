networks:
  inception:
    driver: bridge

volumes:
  mariadb_data:

services:

  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MDB_ROOT_PASSWORD: ${MDB_ROOT_PASSWORD}
      MDB_DATABASE: ${MDB_DATABASE}
      MDB_USER: ${MDB_USER}
      MDB_PASSWORD: ${MDB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
