networks:
  inception:
    driver: bridge

services:
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - 3306:3306
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test:
        [
        "CMD-SHELL",
        "mariadb-admin ping -h localhost -u $(cat /run/secrets/db_health_user) -p$(cat /run/secrets/db_health_password) || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - inception
    secrets:
      - db_root_password
      - db_health_user
      - db_health_password
      - wp_db_name
      - wp_db_password
      - wp_db_user

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - inception
    ports:
      - 9000:9000
    volumes:
      - wp_data:/var/www/html
    healthcheck:
      test:
        [
        "CMD-SHELL",
        "wget -q -O - http://localhost:9000/ >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    secrets:
      - wp_db_name
      - wp_db_user
      - wp_db_password
      - wp_user
      - wp_user_password
      - wp_user_email
      - wp_admin_password
      - wp_admin_email

  nginx:
    build: ./requirements/nginx
    container_name: nginx
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      wordpress:
        condition: service_healthy
    networks:
      - inception
    ports:
      - 80:80
      - 443:443

secrets:
  db_root_password:
    file: ../secrets/db_root_password
  db_health_user:
    file: ../secrets/db_health_user
  db_health_password:
    file: ../secrets/db_health_password
  wp_db_name:
    file: ../secrets/wp_db_name
  wp_db_user:
    file: ../secrets/wp_db_user
  wp_db_password:
    file: ../secrets/wp_db_password
  wp_user:
    file: ../secrets/wp_user
  wp_user_password:
    file: ../secrets/wp_user_password
  wp_user_email:
    file: ../secrets/wp_user_email
  wp_admin_password:
    file: ../secrets/wp_admin_password
  wp_admin_email:
    file: ../secrets/wp_admin_email

volumes:
  mariadb_data:
  wp_data:
